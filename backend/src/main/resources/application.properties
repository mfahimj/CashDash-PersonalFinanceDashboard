# =====================================================================
# Spring Boot Configuration - Personal Finance Dashboard API
# =====================================================================

server.port=8080
server.servlet.context-path=/

# Default Database Configuration: H2 with MySQL syntax mode for zero-setup execution
# (To use real MySQL, run with: -Dspring.profiles.active=mysql or set environment variables)
spring.datasource.url=${DB_URL:jdbc:h2:mem:personal_finance_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# SQL Schema Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson JSON formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration
logging.level.com.finance.tracker=DEBUG
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG


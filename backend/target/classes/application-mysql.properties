# =====================================================================
# MySQL Production / Local Profile
# Activate via: --spring.profiles.active=mysql
# =====================================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/personal_finance_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true


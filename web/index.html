<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CashDash - Smart Finance Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark .custom-scroll::-webkit-scrollbar-thumb { background: #334155; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col md:flex-row custom-scroll">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-full md:w-64 border-r border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900 flex flex-col shrink-0 transition-all duration-300">
    <!-- Brand -->
    <div class="h-16 flex items-center justify-between px-5 border-b border-slate-100 dark:border-slate-800">
      <div class="flex items-center space-x-3">
        <div class="h-10 w-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-sm font-bold text-lg">💰</div>
        <span class="font-bold text-lg text-slate-800 dark:text-white tracking-tight">Cash<span class="text-blue-600">Dash</span></span>
      </div>
      <button onclick="toggleDarkMode()" class="md:hidden text-slate-500 p-2"><i class="fa-solid fa-moon"></i></button>
    </div>

    <!-- Navigation List -->
    <nav class="flex-1 p-3 space-y-1.5 overflow-y-auto">
      <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition bg-blue-50 text-blue-600 dark:bg-blue-950/60 dark:text-blue-400">
        <i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span>
      </button>
      <button onclick="navigate('transactions')" id="nav-transactions" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800/60">
        <i class="fa-solid fa-receipt w-5"></i><span>Transactions</span>
      </button>
      <button onclick="navigate('income')" id="nav-income" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800/60">
        <i class="fa-solid fa-arrow-trend-up w-5 text-emerald-500"></i><span>Income</span>
      </button>
      <button onclick="navigate('expenses')" id="nav-expenses" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800/60">
        <i class="fa-solid fa-arrow-trend-down w-5 text-red-500"></i><span>Expenses</span>
      </button>
      <button onclick="navigate('budgets')" id="nav-budgets" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800/60">
        <i class="fa-solid fa-bullseye w-5 text-amber-500"></i><span>Budgets</span>
      </button>
      <button onclick="navigate('categories')" id="nav-categories" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800/60">
        <i class="fa-solid fa-tags w-5 text-purple-500"></i><span>Categories</span>
      </button>
      <button onclick="navigate('reports')" id="nav-reports" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800/60">
        <i class="fa-solid fa-file-invoice-dollar w-5 text-blue-500"></i><span>Reports & Analytics</span>
      </button>
      <button onclick="navigate('settings')" id="nav-settings" class="nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800/60">
        <i class="fa-solid fa-gear w-5 text-slate-400"></i><span>Settings</span>
      </button>
    </nav>

    <!-- User Profile Footer -->
    <div class="border-t border-slate-200 dark:border-slate-800 p-4 flex items-center space-x-3">
      <div class="h-10 w-10 rounded-full bg-blue-600 text-white font-bold flex items-center justify-center text-sm shadow">GM</div>
      <div class="overflow-hidden">
        <p class="text-sm font-bold truncate text-slate-800 dark:text-white">Gauri Mundada</p>
        <p class="text-xs text-slate-400 truncate">gauri.mundada@gmail.com</p>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-h-screen overflow-hidden">
    <!-- Topbar -->
    <header class="h-16 border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900 px-6 flex items-center justify-between shrink-0">
      <div>
        <h1 id="page-title" class="text-lg font-bold text-slate-900 dark:text-white capitalize">Dashboard</h1>
        <p id="current-date" class="text-xs text-slate-400"></p>
      </div>

      <div class="flex items-center space-x-3">
        <!-- Live Search -->
        <div class="relative hidden sm:block">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
          <input type="text" id="top-search" oninput="handleTopSearch(this.value)" placeholder="Search transactions..."
            class="h-9 w-60 rounded-xl border border-slate-200 bg-slate-50 pl-8 pr-3 text-xs focus:bg-white focus:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-white">
        </div>

        <!-- Notification Bell -->
        <div class="relative">
          <button onclick="toggleNotifications()" class="h-9 w-9 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-50">
            <i class="fa-regular fa-bell text-sm"></i>
            <span class="absolute top-1 right-1 h-2 w-2 rounded-full bg-blue-600"></span>
          </button>
          <div id="notif-dropdown" class="hidden absolute right-0 mt-2 w-72 rounded-2xl border border-slate-200 bg-white p-3 shadow-xl z-50 dark:border-slate-700 dark:bg-slate-900 text-xs">
            <div class="font-bold border-b pb-2 mb-2 dark:border-slate-800">Alerts & Notifications</div>
            <div class="space-y-2">
              <div class="p-2 rounded-lg bg-amber-50 text-amber-900 dark:bg-amber-950/40 dark:text-amber-200 font-medium">⚠️ Housing budget limit reached (100% used).</div>
              <div class="p-2 rounded-lg bg-emerald-50 text-emerald-900 dark:bg-emerald-950/40 dark:text-emerald-200 font-medium">✓ Corporate Payroll credited: ₹85,000.00.</div>
            </div>
          </div>
        </div>

        <!-- Dark Mode Toggle -->
        <button onclick="toggleDarkMode()" class="h-9 w-9 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-50">
          <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
        </button>
      </div>
    </header>

    <!-- Page Content View -->
    <main class="flex-1 p-6 md:p-8 overflow-y-auto custom-scroll" id="main-view">
      <!-- Injected via JavaScript dynamically -->
    </main>
  </div>

  <!-- Add/Edit Transaction Modal -->
  <div id="tx-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
      <div class="flex items-center justify-between pb-3 border-b dark:border-slate-800">
        <h3 id="modal-title" class="font-bold text-base text-slate-900 dark:text-white">Record Transaction</h3>
        <button onclick="closeTxModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="tx-form" onsubmit="submitTransaction(event)" class="mt-4 space-y-3 text-xs">
        <input type="hidden" id="tx-id">
        <div class="flex rounded-xl bg-slate-100 p-1 dark:bg-slate-800">
          <button type="button" onclick="setModalType('EXPENSE')" id="btn-type-exp" class="flex-1 py-1.5 font-bold rounded-lg bg-red-500 text-white shadow">Expense</button>
          <button type="button" onclick="setModalType('INCOME')" id="btn-type-inc" class="flex-1 py-1.5 font-bold rounded-lg text-slate-600 dark:text-slate-300">Income</button>
        </div>
        <div>
          <label class="block mb-1 font-semibold">Description *</label>
          <input type="text" id="tx-desc" required placeholder="e.g. Whole Foods Groceries" class="w-full rounded-xl border border-slate-200 px-3.5 py-2 dark:border-slate-700 dark:bg-slate-800">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block mb-1 font-semibold">Amount (₹) *</label>
            <input type="number" step="0.01" id="tx-amt" required placeholder="0.00" class="w-full rounded-xl border border-slate-200 px-3.5 py-2 dark:border-slate-700 dark:bg-slate-800">
          </div>
          <div>
            <label class="block mb-1 font-semibold">Category *</label>
            <select id="tx-cat" class="w-full rounded-xl border border-slate-200 px-3.5 py-2 dark:border-slate-700 dark:bg-slate-800"></select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block mb-1 font-semibold">Date *</label>
            <input type="date" id="tx-date" required class="w-full rounded-xl border border-slate-200 px-3.5 py-2 dark:border-slate-700 dark:bg-slate-800">
          </div>
          <div>
            <label class="block mb-1 font-semibold">Payment Method *</label>
            <select id="tx-method" class="w-full rounded-xl border border-slate-200 px-3.5 py-2 dark:border-slate-700 dark:bg-slate-800">
              <option value="Bank Transfer">Bank Transfer</option>
              <option value="Credit Card">Credit Card</option>
              <option value="Debit Card">Debit Card</option>
              <option value="UPI">UPI</option>
              <option value="Net Banking">Net Banking</option>
              <option value="Cash">Cash</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block mb-1 font-semibold">Notes (Optional)</label>
          <textarea id="tx-notes" rows="2" class="w-full rounded-xl border border-slate-200 px-3.5 py-2 dark:border-slate-700 dark:bg-slate-800" placeholder="Additional details..."></textarea>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeTxModal()" class="px-4 py-2 border rounded-xl font-semibold dark:border-slate-700">Cancel</button>
          <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-xl font-semibold shadow hover:bg-blue-700">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Budget Modal -->
  <div id="bgt-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-2xl dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
      <div class="flex items-center justify-between pb-3 border-b dark:border-slate-800">
        <h3 class="font-bold text-base text-slate-900 dark:text-white">Configure Budget Limit</h3>
        <button onclick="closeBgtModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="submitBudget(event)" class="mt-4 space-y-3 text-xs">
        <div>
          <label class="block mb-1 font-semibold">Scope / Category</label>
          <select id="bgt-cat" class="w-full rounded-xl border border-slate-200 px-3.5 py-2 dark:border-slate-700 dark:bg-slate-800"></select>
        </div>
        <div>
          <label class="block mb-1 font-semibold">Spending Limit (₹) *</label>
          <input type="number" step="0.01" id="bgt-amt" required placeholder="e.g. 15000" class="w-full rounded-xl border border-slate-200 px-3.5 py-2 dark:border-slate-700 dark:bg-slate-800">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeBgtModal()" class="px-4 py-2 border rounded-xl font-semibold dark:border-slate-700">Cancel</button>
          <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-xl font-semibold shadow hover:bg-blue-700">Set Budget</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Category Modal -->
  <div id="cat-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-sm rounded-2xl bg-white p-6 shadow-2xl dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
      <div class="flex items-center justify-between pb-3 border-b dark:border-slate-800">
        <h3 class="font-bold text-base text-slate-900 dark:text-white">Add Category</h3>
        <button onclick="closeCatModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="submitCategory(event)" class="mt-4 space-y-3 text-xs">
        <div>
          <label class="block mb-1 font-semibold">Name *</label>
          <input type="text" id="cat-name" required placeholder="Category name" class="w-full rounded-xl border border-slate-200 px-3.5 py-2 dark:border-slate-700 dark:bg-slate-800">
        </div>
        <div>
          <label class="block mb-1 font-semibold">Type</label>
          <select id="cat-type" class="w-full rounded-xl border border-slate-200 px-3.5 py-2 dark:border-slate-700 dark:bg-slate-800">
            <option value="EXPENSE">Expense</option>
            <option value="INCOME">Income</option>
          </select>
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" onclick="closeCatModal()" class="px-4 py-2 border rounded-xl font-semibold dark:border-slate-700">Cancel</button>
          <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-xl font-semibold shadow hover:bg-blue-700">Create</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Application Logic JavaScript -->
  <script>
    let activePage = 'dashboard';
    let currencySymbol = '₹';
    let currentMonth = 10;
    let currentYear = 2026;
    let categories = [];
    let modalType = 'EXPENSE';

    document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'long', month: 'short', day: 'numeric', year: 'numeric'
    });

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-sun text-sm' : 'fa-solid fa-moon text-sm';
    }

    function toggleNotifications() {
      document.getElementById('notif-dropdown').classList.toggle('hidden');
    }

    function formatMoney(num) {
      return currencySymbol + Number(num || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    async function loadCategories() {
      try {
        const res = await fetch('/api/categories');
        categories = await res.json();
      } catch (e) { console.error(e); }
    }

    function navigate(page) {
      activePage = page;
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.className = 'nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-800/60';
      });
      const activeBtn = document.getElementById('nav-' + page);
      if (activeBtn) activeBtn.className = 'nav-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition bg-blue-50 text-blue-600 dark:bg-blue-950/60 dark:text-blue-400';
      document.getElementById('page-title').textContent = page.replace('-', ' ');

      if (page === 'dashboard') renderDashboard();
      else if (page === 'transactions') renderTransactions();
      else if (page === 'income') renderIncome();
      else if (page === 'expenses') renderExpenses();
      else if (page === 'budgets') renderBudgets();
      else if (page === 'categories') renderCategories();
      else if (page === 'reports') renderReports();
      else if (page === 'settings') renderSettings();
    }

    async function renderDashboard() {
      const view = document.getElementById('main-view');
      view.innerHTML = '<div class="py-12 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="mt-2 text-xs">Loading financial data...</p></div>';

      const [sumRes, trendsRes, catRes] = await Promise.all([
        fetch(`/api/dashboard/summary?month=${currentMonth}&year=${currentYear}`),
        fetch(`/api/analytics/monthly?months=6`),
        fetch(`/api/analytics/categories?month=${currentMonth}&year=${currentYear}`)
      ]);

      const sum = await sumRes.json();
      const trends = await trendsRes.json();
      const catBreakdown = await catRes.json();

      let maxVal = Math.max(...trends.map(t => Math.max(t.income, t.expenses)), 1);

      let barsHtml = trends.map(t => {
        let incH = Math.round((t.income / maxVal) * 140);
        let expH = Math.round((t.expenses / maxVal) * 140);
        return `
          <div class="flex-1 flex flex-col items-center">
            <div class="h-40 flex items-end space-x-1.5 w-full justify-center">
              <div style="height: ${incH}px" class="w-3.5 rounded-t bg-emerald-500 hover:opacity-80 transition" title="${t.monthLabel} Income: ${formatMoney(t.income)}"></div>
              <div style="height: ${expH}px" class="w-3.5 rounded-t bg-red-500 hover:opacity-80 transition" title="${t.monthLabel} Expense: ${formatMoney(t.expenses)}"></div>
            </div>
            <span class="text-[10px] text-slate-400 mt-2 font-medium truncate w-full text-center">${t.monthLabel}</span>
          </div>`;
      }).join('');

      let catHtml = Object.entries(catBreakdown).map(([name, val], i) => {
        let colors = ['bg-blue-500', 'bg-emerald-500', 'bg-amber-500', 'bg-purple-500', 'bg-red-500', 'bg-cyan-500', 'bg-pink-500'];
        let c = colors[i % colors.length];
        return `
          <div class="flex items-center justify-between text-xs py-1.5">
            <span class="flex items-center space-x-2">
              <span class="h-2 w-2 rounded-full ${c}"></span>
              <span class="font-medium text-slate-700 dark:text-slate-300 truncate max-w-[130px]">${name}</span>
            </span>
            <span class="font-bold text-slate-900 dark:text-white">${formatMoney(val)}</span>
          </div>`;
      }).join('');

      let txRows = sum.recentTransactions.map(tx => `
        <tr class="hover:bg-slate-50/60 dark:hover:bg-slate-800/40">
          <td class="py-3 px-4 font-semibold text-slate-900 dark:text-white">${tx.description}</td>
          <td class="py-3 px-4"><span class="bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded text-[11px] font-medium">${tx.categoryName || 'Other'}</span></td>
          <td class="py-3 px-4 text-slate-400">${tx.transactionDate}</td>
          <td class="py-3 px-4 text-slate-400">${tx.paymentMethod}</td>
          <td class="py-3 px-4 text-right font-bold ${tx.type === 'INCOME' ? 'text-emerald-600' : 'text-red-600'}">
            ${tx.type === 'INCOME' ? '+' : '-'} ${formatMoney(tx.amount)}
          </td>
        </tr>`).join('');

      view.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-xl font-bold text-slate-900 dark:text-white">Overview Snapshot</h2>
              <p class="text-xs text-slate-500">Live balance and financial intelligence</p>
            </div>
            <button onclick="openTxModal()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold shadow hover:bg-blue-700 flex items-center space-x-1.5">
              <i class="fa-solid fa-plus"></i><span>Add Transaction</span>
            </button>
          </div>

          <!-- 5 Metric Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
              <span class="text-xs font-semibold text-slate-400 uppercase">Total Balance</span>
              <div class="text-2xl font-bold my-2 text-slate-900 dark:text-white">${formatMoney(sum.totalBalance)}</div>
              <p class="text-[11px] text-slate-500">Baseline + Net savings</p>
            </div>
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
              <span class="text-xs font-semibold text-slate-400 uppercase">Total Income</span>
              <div class="text-2xl font-bold my-2 text-emerald-600">${formatMoney(sum.totalIncome)}</div>
              <p class="text-[11px] text-emerald-600 font-semibold">+${sum.incomeGrowthPercent.toFixed(1)}% vs last mo</p>
            </div>
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
              <span class="text-xs font-semibold text-slate-400 uppercase">Total Expenses</span>
              <div class="text-2xl font-bold my-2 text-red-600">${formatMoney(sum.totalExpenses)}</div>
              <p class="text-[11px] text-red-600 font-semibold">+${sum.expenseGrowthPercent.toFixed(1)}% vs last mo</p>
            </div>
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900">
              <span class="text-xs font-semibold text-slate-400 uppercase">Net Savings</span>
              <div class="text-2xl font-bold my-2 text-blue-600">${formatMoney(sum.totalSavings)}</div>

          <!-- Charts Row -->

              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-sm text-slate-900 dark:text-white">Cashflow Velocity (6 Months)</h3>

                  <span class="flex items-center space-x-1"><span class="h-2.5 w-2.5 bg-emerald-500 rounded"></span><span>Income</span></span>
                  <span class="flex items-center space-x-1"><span class="h-2.5 w-2.5 bg-red-500 rounded"></span><span>Expense</span></span>

              <div class="flex items-end justify-between space-x-3 pt-4 border-b border-slate-100 dark:border-slate-800 pb-2">${barsHtml}</div>

    async function renderTransactions() {
      const view = document.getElementById('main-view');
      const res = await fetch('/api/transactions');
      const txs = await res.json();

      let rows = txs.map(tx => `
        <tr class="hover:bg-slate-50/60 dark:hover:bg-slate-800/40 transition">
          <td class="py-3 px-4 font-bold text-slate-900 dark:text-white">${tx.description}</td>
          <td class="py-3 px-4"><span class="bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded text-[11px] font-medium">${tx.categoryName || 'Other'}</span></td>
          <td class="py-3 px-4 text-slate-400">${tx.transactionDate}</td>
          <td class="py-3 px-4 text-slate-400">${tx.paymentMethod}</td>
          <td class="py-3 px-4"><span class="rounded-full px-2 py-0.5 text-[10px] font-bold ${tx.type === 'INCOME' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}">${tx.type}</span></td>
          <td class="py-3 px-4 text-right font-bold ${tx.type === 'INCOME' ? 'text-emerald-600' : 'text-red-600'}">

          <td class="py-3 px-4 text-center">
            <button onclick="deleteTx(${tx.id})" class="text-slate-400 hover:text-red-600 p-1" title="Delete"><i class="fa-solid fa-trash text-xs"></i></button>
          </td>
        </tr>`).join('');

      view.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-xl font-bold text-slate-900 dark:text-white">Transaction Management</h2>
              <p class="text-xs text-slate-500">Record, filter, inspect, and export your personal transactions</p>
            </div>
            <div class="flex items-center space-x-2">
              <a href="/api/reports/export-csv" class="px-3.5 py-2 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold hover:bg-slate-50 flex items-center space-x-1.5 shadow-sm">
                <i class="fa-solid fa-download"></i><span>Export CSV</span>
              </a>
              <button onclick="openTxModal()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold shadow hover:bg-blue-700 flex items-center space-x-1.5">
                <i class="fa-solid fa-plus"></i><span>Add Transaction</span>
              </button>
            </div>
          </div>

          <div class="rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900 overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="border-b bg-slate-50 dark:bg-slate-800/40 text-slate-500">
                  <tr>
                    <th class="py-3 px-4 font-semibold">Description</th>
                    <th class="py-3 px-4 font-semibold">Category</th>
                    <th class="py-3 px-4 font-semibold">Date</th>
                    <th class="py-3 px-4 font-semibold">Method</th>
                    <th class="py-3 px-4 font-semibold">Type</th>
                    <th class="py-3 px-4 text-right font-semibold">Amount</th>
                    <th class="py-3 px-4 text-center font-semibold">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">${rows}</tbody>
              </table>
            </div>
          </div>
        </div>`;
    }

    async function renderIncome() {
      const view = document.getElementById('main-view');
      const res = await fetch('/api/transactions?type=INCOME');
      const txs = await res.json();
      let total = txs.reduce((s, t) => s + t.amount, 0);

      view.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Income Inflows (${formatMoney(total)})</h2>
            <button onclick="openTxModal('INCOME')" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-semibold shadow hover:bg-emerald-700">+ Record Income</button>
          </div>
          <div class="rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900 overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="border-b bg-slate-50 dark:bg-slate-800/40 text-slate-500">
                <tr><th class="py-3 px-4">Description</th><th class="py-3 px-4">Source</th><th class="py-3 px-4">Date</th><th class="py-3 px-4">Method</th><th class="py-3 px-4 text-right">Amount</th></tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                ${txs.map(t => `<tr class="hover:bg-slate-50/60"><td class="py-3 px-4 font-bold text-slate-900 dark:text-white">${t.description}</td><td class="py-3 px-4"><span class="bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded text-[11px] font-semibold">${t.categoryName}</span></td><td class="py-3 px-4 text-slate-400">${t.transactionDate}</td><td class="py-3 px-4 text-slate-400">${t.paymentMethod}</td><td class="py-3 px-4 text-right font-bold text-emerald-600">+ ${formatMoney(t.amount)}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    async function renderExpenses() {
      const view = document.getElementById('main-view');
      const res = await fetch('/api/transactions?type=EXPENSE');
      const txs = await res.json();
      let total = txs.reduce((s, t) => s + t.amount, 0);

      view.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Expense Outflows (${formatMoney(total)})</h2>
            <button onclick="openTxModal('EXPENSE')" class="px-4 py-2 bg-red-600 text-white rounded-xl text-xs font-semibold shadow hover:bg-red-700">+ Record Expense</button>
          </div>
          <div class="rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900 overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="border-b bg-slate-50 dark:bg-slate-800/40 text-slate-500">
                <tr><th class="py-3 px-4">Description</th><th class="py-3 px-4">Category</th><th class="py-3 px-4">Date</th><th class="py-3 px-4">Method</th><th class="py-3 px-4 text-right">Amount</th></tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                ${txs.map(t => `<tr class="hover:bg-slate-50/60"><td class="py-3 px-4 font-bold text-slate-900 dark:text-white">${t.description}</td><td class="py-3 px-4"><span class="bg-red-50 text-red-700 px-2 py-0.5 rounded text-[11px] font-semibold">${t.categoryName}</span></td><td class="py-3 px-4 text-slate-400">${t.transactionDate}</td><td class="py-3 px-4 text-slate-400">${t.paymentMethod}</td><td class="py-3 px-4 text-right font-bold text-red-600">- ${formatMoney(t.amount)}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    async function renderBudgets() {
      const view = document.getElementById('main-view');
      const res = await fetch(`/api/budgets?month=${currentMonth}&year=${currentYear}`);
      const bgts = await res.json();

      let cards = bgts.map(b => `
        <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between font-bold text-sm">
              <span>${b.categoryName || 'Overall Budget'}</span>
              <button onclick="deleteBudget(${b.id})" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>
            <div class="flex justify-between text-xs mt-3 text-slate-500">
              <span>Spent: <b class="text-slate-900 dark:text-white">${formatMoney(b.spent)}</b></span>
              <span>Limit: <b class="text-slate-900 dark:text-white">${formatMoney(b.amount)}</b></span>
            </div>
            <div class="h-2 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden mt-2">
              <div style="width: ${Math.min(100, b.percentage)}%" class="h-full rounded-full ${b.percentage >= 100 ? 'bg-red-500' : b.percentage >= 80 ? 'bg-amber-500' : 'bg-emerald-500'}"></div>
            </div>
          </div>
          <div class="flex items-center justify-between pt-3 border-t mt-4 text-xs dark:border-slate-800">
            <span class="font-bold">${b.percentage.toFixed(1)}% Used</span>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${b.percentage >= 100 ? 'bg-red-100 text-red-700' : b.percentage >= 80 ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">${b.status}</span>
          </div>
        </div>`).join('');

      view.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Budget Management</h2>
            <button onclick="openBgtModal()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold shadow hover:bg-blue-700">+ Set Budget Limit</button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${cards}</div>
        </div>`;
    }

    async function renderCategories() {
      const view = document.getElementById('main-view');
      await loadCategories();

      let cards = categories.map(c => `
        <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm dark:border-slate-800 dark:bg-slate-900 flex items-center justify-between">
          <div>
            <h4 class="font-bold text-xs text-slate-900 dark:text-white">${c.name}</h4>
            <span class="text-[11px] text-slate-400">${c.type} • ${c.transactionCount || 0} transactions</span>
          </div>
          ${(c.transactionCount || 0) === 0 ? `<button onclick="deleteCategory(${c.id})" class="text-slate-400 hover:text-red-500 p-1"><i class="fa-solid fa-trash text-xs"></i></button>` : '<i class="fa-solid fa-shield-halved text-emerald-500 text-xs" title="Protected"></i>'}
        </div>`).join('');

      view.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Categories (${categories.length})</h2>
            <button onclick="openCatModal()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold shadow hover:bg-blue-700">+ Add Category</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">${cards}</div>
        </div>`;
    }

    async function renderReports() {
      const view = document.getElementById('main-view');
      const res = await fetch('/api/analytics/monthly?months=6');
      const trends = await res.json();

      let rows = trends.map(t => `
        <tr class="hover:bg-slate-50/60 dark:hover:bg-slate-800/40">
          <td class="py-3 px-4 font-bold text-slate-900 dark:text-white">${t.monthLabel}</td>
          <td class="py-3 px-4 text-emerald-600 font-semibold">+ ${formatMoney(t.income)}</td>
          <td class="py-3 px-4 text-red-600 font-semibold">- ${formatMoney(t.expenses)}</td>
          <td class="py-3 px-4 font-bold text-blue-600">${formatMoney(t.savings)}</td>
          <td class="py-3 px-4 text-right font-semibold">${t.income > 0 ? ((t.savings / t.income) * 100).toFixed(1) : 0}%</td>
        </tr>`).join('');

      view.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Financial Reports & Summary</h2>
            <div class="flex space-x-2">
              <button onclick="window.print()" class="px-3.5 py-2 border rounded-xl text-xs font-semibold shadow-sm hover:bg-slate-50"><i class="fa-solid fa-print"></i> Print</button>
              <a href="/api/reports/export-csv" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold shadow hover:bg-blue-700"><i class="fa-solid fa-download"></i> Export CSV</a>
            </div>
          </div>
          <div class="rounded-2xl border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900 overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="border-b bg-slate-50 dark:bg-slate-800/40 text-slate-500">
                <tr><th class="py-3 px-4">Period</th><th class="py-3 px-4">Inflow</th><th class="py-3 px-4">Outflow</th><th class="py-3 px-4">Net Savings</th><th class="py-3 px-4 text-right">Savings Rate</th></tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800">${rows}</tbody>
            </table>
          </div>
        </div>`;
    }

    function renderSettings() {
      const view = document.getElementById('main-view');
      view.innerHTML = `
        <div class="max-w-2xl space-y-6">
          <h2 class="text-xl font-bold text-slate-900 dark:text-white">Application Settings</h2>
          <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900 space-y-4 text-xs">
            <div>
              <label class="block mb-1 font-semibold">Currency Preference</label>
              <select onchange="currencySymbol = this.value; navigate('settings')" class="w-full rounded-xl border p-2 dark:bg-slate-800 dark:border-slate-700">
                <option value="₹" ${currencySymbol === '₹' ? 'selected' : ''}>INR (₹) - Indian Rupee</option>
                <option value="$" ${currencySymbol === '$' ? 'selected' : ''}>USD ($) - US Dollar</option>
                <option value="€" ${currencySymbol === '€' ? 'selected' : ''}>EUR (€) - Euro</option>
                <option value="£" ${currencySymbol === '£' ? 'selected' : ''}>GBP (£) - British Pound</option>
              </select>
            </div>
            <div>
              <label class="block mb-1 font-semibold">Account Owner</label>
              <input type="text" value="Gauri Mundada (gauri.mundada@gmail.com)" readonly class="w-full rounded-xl border p-2 bg-slate-50 dark:bg-slate-800 dark:border-slate-700">
            </div>
            <div class="pt-2 border-t dark:border-slate-800">
              <span class="font-bold">Backend Architecture:</span>
              <p class="text-slate-400 mt-1">Java 26 • PreparedStatement / ResultSet JDBC Driver • Persistent Data Store • REST API at /api/*</p>
            </div>
          </div>
        </div>`;
    }

    // Modal helpers
    function openTxModal(preType = 'EXPENSE') {
      document.getElementById('tx-id').value = '';
      document.getElementById('tx-desc').value = '';
      document.getElementById('tx-amt').value = '';
      document.getElementById('tx-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('tx-notes').value = '';
      setModalType(preType);
      document.getElementById('tx-modal').classList.remove('hidden');
    }

    function closeTxModal() { document.getElementById('tx-modal').classList.add('hidden'); }

    function setModalType(type) {
      modalType = type;
      const bExp = document.getElementById('btn-type-exp');
      const bInc = document.getElementById('btn-type-inc');
      if (type === 'EXPENSE') {
        bExp.className = 'flex-1 py-1.5 font-bold rounded-lg bg-red-500 text-white shadow';
        bInc.className = 'flex-1 py-1.5 font-bold rounded-lg text-slate-600 dark:text-slate-300';
      } else {
        bInc.className = 'flex-1 py-1.5 font-bold rounded-lg bg-emerald-500 text-white shadow';
        bExp.className = 'flex-1 py-1.5 font-bold rounded-lg text-slate-600 dark:text-slate-300';
      }
      const catSelect = document.getElementById('tx-cat');
      catSelect.innerHTML = categories.filter(c => c.type === type).map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    async function submitTransaction(e) {
      e.preventDefault();
      const tx = {
        description: document.getElementById('tx-desc').value,
        amount: parseFloat(document.getElementById('tx-amt').value),
        type: modalType,
        categoryId: parseInt(document.getElementById('tx-cat').value),
        transactionDate: document.getElementById('tx-date').value,
        paymentMethod: document.getElementById('tx-method').value,
        notes: document.getElementById('tx-notes').value
      };
      await fetch('/api/transactions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(tx) });
      closeTxModal();
      navigate(activePage);
    }

    async function deleteTx(id) {
      if (confirm('Delete this transaction?')) {
        await fetch('/api/transactions/' + id, { method: 'DELETE' });
        navigate(activePage);
      }
    }

    function openBgtModal() {
      const select = document.getElementById('bgt-cat');
      select.innerHTML = '<option value="">Overall Monthly Budget</option>' + categories.filter(c => c.type === 'EXPENSE').map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      document.getElementById('bgt-modal').classList.remove('hidden');
    }
    function closeBgtModal() { document.getElementById('bgt-modal').classList.add('hidden'); }
    async function submitBudget(e) {
      e.preventDefault();
      const b = {
        categoryId: document.getElementById('bgt-cat').value || null,
        amount: parseFloat(document.getElementById('bgt-amt').value),
        month: currentMonth,
        year: currentYear
      };
      await fetch('/api/budgets', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
      closeBgtModal();
      navigate('budgets');
    }
    async function deleteBudget(id) {
      if (confirm('Delete budget limit?')) {
        await fetch('/api/budgets/' + id, { method: 'DELETE' });
        navigate('budgets');
      }
    }

    function openCatModal() { document.getElementById('cat-modal').classList.remove('hidden'); }
    function closeCatModal() { document.getElementById('cat-modal').classList.add('hidden'); }
    async function submitCategory(e) {
      e.preventDefault();
      const cat = {
        name: document.getElementById('cat-name').value,
        type: document.getElementById('cat-type').value
      };
      await fetch('/api/categories', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cat) });
      closeCatModal();
      navigate('categories');
    }
    async function deleteCategory(id) {
      if (confirm('Delete category?')) {
        const res = await fetch('/api/categories/' + id, { method: 'DELETE' });
        if (!res.ok) alert('Cannot delete category: it is referenced by transactions');
        else navigate('categories');
      }
    }

    function handleTopSearch(query) {
      if (query.trim() && activePage !== 'transactions') {
        navigate('transactions');
      }
    }

    // Initial boot
    loadCategories().then(() => navigate('dashboard'));
  </script>
</body>
</html>
